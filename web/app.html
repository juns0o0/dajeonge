<div class="login" id="login">
  <form class="card stack" id="loginForm">
    <div style="display:flex;align-items:center;gap:10px"><div style="width:40px" id="mark"></div><h2>다정이 보호자 앱</h2></div>
    <p class="muted">가족 코드와 보호자 비밀번호를 입력합니다.</p>
    <div class="field"><label for="code">가족 코드</label><input id="code" autocomplete="username" placeholder="예: DEMO1" required></div>
    <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr"></p>
    <button class="btn dark lg block" type="submit">들어가기</button>
    <p class="faint" style="font-size:12.5px">시연 계정: DEMO1 / 1234</p>
  </form>
</div>
